name: Android upload key (create once)

# Creates the key that signs every Google Play upload -- run this ONCE,
# before the first release. Steps: docs/MOBILE_RELEASE.md, section 3.
#
# This repo is public, so anyone signed in to GitHub can download a run's
# artifacts and read its logs. The key therefore never leaves this job
# unencrypted: the artifact is the key locked with the
# ANDROID_UPLOAD_KEYSTORE_PASSWORD secret, and that locked text is what
# goes into the ANDROID_UPLOAD_KEYSTORE secret.

on:
  workflow_dispatch:
    inputs:
      replace:
        description: "Replace an existing key (only after Google Play has reset the upload key)"
        type: boolean
        default: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets
        env:
          PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          EXISTING: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          REPLACE: ${{ inputs.replace }}
        run: |
          if [ ${#PASS} -lt 20 ]; then
            echo "::error::Add the ANDROID_UPLOAD_KEYSTORE_PASSWORD secret first: at least 20 characters (four or more random words works). The locked key is only as strong as this password."
            exit 1
          fi
          if [ -n "$EXISTING" ] && [ "$REPLACE" != "true" ]; then
            echo "::error::An upload key already exists (the ANDROID_UPLOAD_KEYSTORE secret). Google Play only accepts uploads signed by the key it was first given, so replacing it breaks releases until Play resets the key."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Create and lock the key
        env:
          PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          cd "$RUNNER_TEMP"
          keytool -genkeypair -storetype PKCS12 -keystore upload.p12 \
            -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass:env PASS -keypass:env PASS \
            -dname "CN=AI Build Pros LLC, O=AI Build Pros LLC, C=US"
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --s2k-digest-algo SHA512 --s2k-count 65011712 \
            -o upload.p12.gpg upload.p12
          mkdir out
          base64 -w0 upload.p12.gpg > out/ANDROID_UPLOAD_KEYSTORE.txt
          # The certificate fingerprint is public, and lets anyone check the
          # key Play has on file is this one.
          keytool -list -v -keystore upload.p12 -storepass:env PASS \
            | grep -E "SHA256:" | tee out/fingerprint.txt
          rm upload.p12 upload.p12.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-key-locked
          path: ${{ runner.temp }}/out/
          retention-days: 1
