name: Google Calendar Sync

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Google Calendar sync
        run: |
          curl -sf -X POST "https://crm.aibuildpros.com/api/cron/google-calendar-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
