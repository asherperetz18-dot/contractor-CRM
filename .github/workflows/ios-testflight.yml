name: iPhone App (TestFlight)

# Builds the iPhone app from main, signs it, and uploads it to TestFlight.
# Run it from the Actions tab. Steps: docs/MOBILE_RELEASE.md, section 2
# (DECISIONS #171). It never submits anything for App Store review.
#
# Signing is manual on purpose: the App Manager API key can create the
# App Store provisioning profile, but Xcode's automatic "cloud" signing
# needs an Admin key. The certificate comes from the IOS_DISTRIBUTION_CERTIFICATE
# secret (made by "iPhone signing certificate (create once)").

on:
  workflow_dispatch: {}

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # A store build comes from reviewed code only.
    if: github.ref == 'refs/heads/main'
    # Apple only takes uploads built with Xcode 26 or later (since 2026-04-28).
    runs-on: macos-26
    steps:
      - name: Check the secrets
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          PASS: ${{ secrets.IOS_SIGNING_PASSWORD }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$ASC_KEY" ] || missing="$missing APP_STORE_CONNECT_KEY"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$PASS" ] || missing="$missing IOS_SIGNING_PASSWORD"
          [ -n "$CERT" ] || missing="$missing IOS_DISTRIBUTION_CERTIFICATE"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. See docs/MOBILE_RELEASE.md, section 2."
            exit 1
          fi
          if [ "$TEAM_ID" != "7U97978GD3" ]; then
            echo "::error::APPLE_TEAM_ID doesn't match the team in the Xcode project (mobile/ios/App/App.xcodeproj)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios
      - name: Install the certificate
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          PASS: ${{ secrets.IOS_SIGNING_PASSWORD }}
        run: |
          command -v gpg >/dev/null || brew install gnupg
          cd "$RUNNER_TEMP"
          umask 077
          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          printf '%s' "$CERT" | base64 --decode > dist.p12.gpg
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt -o dist.p12 dist.p12.gpg
          rm dist.p12.gpg
          # A keychain of our own, unlocked for this run only.
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import dist.p12 -k "$KEYCHAIN" -P "$PASS" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          # Apple's intermediate, so codesign can build the chain.
          curl -fsSL -o wwdr.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import wwdr.cer -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          SERIAL="$(openssl pkcs12 -in dist.p12 -nokeys -clcerts -passin env:PASS | openssl x509 -noout -serial)"
          echo "CERT_SERIAL=${SERIAL#serial=}" >> "$GITHUB_ENV"
          rm dist.p12 wwdr.cer
      - name: Fetch the App Store profile
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          node mobile/release/app-store-connect.mjs provisioning-profile \
            --bundle-id com.aibuildpros.crm --cert-serial "$CERT_SERIAL" \
            --name "AI Build Pros CRM App Store" --out "$RUNNER_TEMP/app-store.mobileprovision"
          UUID="$(security cms -D -i "$RUNNER_TEMP/app-store.mobileprovision" | plutil -extract UUID raw -)"
          # Xcode 16+ reads the first folder, older Xcode the second.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/app-store.mobileprovision" "$dir/$UUID.mobileprovision"
          done
      - name: Build the archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive
      - name: Export the signed app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist mobile/ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
          ls -l "$RUNNER_TEMP/export"
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          # altool finds the key by its ID in this folder.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          ( umask 077; printf '%s\n' "$ASC_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" )
          # -t is --type on older altool and --platform on newer; both take ios.
          xcrun altool --upload-app -t ios \
            -f "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          {
            echo "### Build 1.0.${{ github.run_number }} (${{ github.run_number }}) uploaded"
            echo "Apple processes it for 5 to 30 minutes. It then shows in App Store Connect → the app → TestFlight, and in the TestFlight app on your iPhone."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the signing files
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8
          rm -f "$RUNNER_TEMP"/dist.p12 "$RUNNER_TEMP"/dist.p12.gpg "$RUNNER_TEMP"/app-store.mobileprovision
