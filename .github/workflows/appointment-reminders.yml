name: Appointment Reminder Check

on:
  # The timer (*/15 * * * * UTC) runs from the database now: Supabase Cron,
  # migration 0203 (DECISIONS #140). This button runs it by hand.
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger appointment reminder check
        run: |
          curl -sf -X POST "https://crm.aibuildpros.com/api/cron/appointment-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
