name: Rain Alerts Check

on:
  schedule:
    - cron: "0 6,14,22 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rain-alerts check
        run: |
          curl -sf -X POST "https://crm.aibuildpros.com/api/cron/rain-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
