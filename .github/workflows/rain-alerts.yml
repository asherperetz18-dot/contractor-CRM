name: Rain Alerts Check

on:
  # The timer (0 6,14,22 * * * UTC) runs from the database now: Supabase Cron,
  # migration 0203 (DECISIONS #140). This button runs it by hand.
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rain-alerts check
        run: |
          curl -sf -X POST "https://crm.aibuildpros.com/api/cron/rain-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
