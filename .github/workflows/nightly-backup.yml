name: Nightly CRM Backup

on:
  schedule:
    # 09:15 UTC ~= 02:15 Pacific -- after the day's work, before the next.
    - cron: "15 9 * * *"
  workflow_dispatch: {}

# This repository is public, and anyone signed in to GitHub can download
# a public repository's artifacts. The backup holds every company's
# customers, so it is locked with the BACKUP_PASSPHRASE secret before it
# is uploaded, and the job refuses to run without that secret rather than
# store an unlocked copy (DECISIONS #098). To open one:
#   gpg --decrypt crm-backup-YYYY-MM-DD.json.gpg > crm-backup.json
# and type the password when asked.

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the backup password is set
        run: |
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::Add the BACKUP_PASSPHRASE secret (Settings -> Secrets and variables -> Actions) -- the backup is never stored unlocked."
            exit 1
          fi

      - name: Export CRM data
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%d)"
          # -f so an HTTP error fails the step instead of saving an error
          # page as if it were a backup.
          curl -sf -X POST "https://crm.aibuildpros.com/api/cron/backup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -o "crm-backup-${STAMP}.json"

      - name: Verify the export is usable
        run: |
          set -euo pipefail
          FILE="$(ls crm-backup-*.json)"
          # A backup nobody checks is a backup nobody can trust: confirm it
          # parses, reports no skipped tables, and actually contains leads.
          TOTAL=$(jq -r '.totalRows' "$FILE")
          LEADS=$(jq -r '.counts.leads // 0' "$FILE")
          SKIPPED=$(jq -r '.skipped | length' "$FILE")
          SIZE=$(wc -c < "$FILE")
          echo "rows=$TOTAL leads=$LEADS skipped=$SKIPPED bytes=$SIZE"
          if [ "$SKIPPED" -ne 0 ]; then echo "::error::tables were skipped"; exit 1; fi
          if [ "$LEADS" -lt 1 ]; then echo "::error::no leads in backup"; exit 1; fi

      - name: Lock the backup with the password
        run: |
          set -euo pipefail
          FILE="$(ls crm-backup-*.json)"
          # A fresh, short-pathed key folder: gpg's agent cannot start
          # where the socket path is too long, and then exits non-zero.
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$FILE.gpg" "$FILE"
          rm -f "$FILE"
          ls -l crm-backup-*.json.gpg

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: crm-backup-${{ github.run_id }}
          path: crm-backup-*.json.gpg
          retention-days: 90
          if-no-files-found: error
