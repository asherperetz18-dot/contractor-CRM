name: Android App (test build)

# Builds the installable Android test app (a debug APK) from mobile/.
# Download it from the run's "Artifacts" section and install it on an
# Android phone -- no Google Play account needed for testing.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-app.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The ubuntu runner ships the Android SDK (ANDROID_HOME) with licenses
      # accepted; Gradle fetches any missing platform itself.
      - name: Install and sync
        run: |
          npm ci
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ai-build-pros-crm-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
