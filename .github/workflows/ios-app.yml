name: iPhone App (test build)

# Proves the iPhone app still builds on every PR that touches mobile/,
# the way the Android test build does. Nothing is signed and no secrets
# are used, so the TestFlight run (ios-testflight.yml) is the only place
# signing can fail (DECISIONS #171).

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-app.yml"
      - ".github/workflows/ios-testflight.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-app.yml"

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios
      - name: Build the archive, unsigned
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            archive
