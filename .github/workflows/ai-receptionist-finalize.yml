name: AI Receptionist Finalize

on:
  # The timer (13 */2 * * * UTC) runs from the database now: Supabase Cron,
  # migration 0203 (DECISIONS #140). This button runs it by hand.
  workflow_dispatch: {}

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep unfinished AI receptionist calls
        run: |
          curl -sf -X POST "https://crm.aibuildpros.com/api/cron/ai-receptionist-finalize" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
