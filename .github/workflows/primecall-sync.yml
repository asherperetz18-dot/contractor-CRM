name: PrimeCall Sync

on:
  # The timer (*/15 * * * * UTC) runs from the database now: Supabase Cron,
  # migration 0203 (DECISIONS #140). This button runs it by hand.
  workflow_dispatch:
    inputs:
      days:
        description: "Import this many days of history instead (no new-lead texts)"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Re-read recent PrimeCall calls
        run: |
          set -euo pipefail
          DAYS="${{ github.event.inputs.days || '' }}"
          curl -sf -X POST "https://crm.aibuildpros.com/api/cron/primecall-sync?days=${DAYS}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
