name: Time Clock Housekeeping

on:
  # The timer (7 * * * * UTC) runs from the database now: Supabase Cron,
  # migration 0203 (DECISIONS #140). This button runs it by hand.
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Auto clock-out forgotten shifts and purge old location trails
        run: |
          curl -sf -X POST "https://crm.aibuildpros.com/api/cron/time-clock" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
